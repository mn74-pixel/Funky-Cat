name: Localization and game tests
on:
  push:
    branches: [work/stage-visuals-20261106]
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: python3 -m http.server 8765 > /tmp/funky-server.log 2>&1 &
      - run: node tests/chorus.cjs
      - run: node tests/localization.cjs
